[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaia2-mt"
version = "0.1.0"
description = "Omnilingual-GAIA2: multilingual translation pipeline for the Gaia2 benchmark"
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.10"
dependencies = [
    "openai",
    "tenacity",
    "tqdm",
    "datasets",
    "pandas",
    "numpy",
    "fire",
    "nest-asyncio",
    "fasttext-numpy2-wheel",
    "huggingface_hub",
    "xxhash",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright==1.1.399",
    "ruff==0.11.5",
]

[tool.hatch.build.targets.wheel]
packages = ["gaia2_mt"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E501"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["gaia2_mt"]
