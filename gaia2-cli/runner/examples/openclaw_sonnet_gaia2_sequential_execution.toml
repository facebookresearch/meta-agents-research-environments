# OpenClaw + Anthropic Sonnet 4.6 on sequential execution, pass@1.
#
# Chains 95 of the 160 execution scenarios per universe (10 chains), in an
# order where one scenario's writes do not break a later scenario's oracle.
# Each scenario starts from the agent home (memory + conversation) and app
# state the previous scenario of its chain left behind.

[target]
dataset = "meta-agents-research-environments/gaia2-cli"
splits = ["execution"]
sequences = "../sequences/execution.jsonl"

[agent]
image = "localhost/gaia2-oc:latest"
provider = "anthropic"
model = "claude-sonnet-4-6"
api_key_env = "ANTHROPIC_API_KEY"
thinking = "high"
# context_window = 64000  # compact the carried conversation sooner

[judge]
provider = "anthropic"
model = "claude-sonnet-4-6"
api_key_env = "ANTHROPIC_API_KEY"

[run]
timeout = 900
health_timeout = 180
concurrency = 10  # chains run in parallel; scenarios within a chain never do
pass_at = 1
output_dir = "/tmp/gaia2_openclaw_sonnet_sequential_execution"
log_level = "INFO"
