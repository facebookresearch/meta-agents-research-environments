# Template: Omnilingual-GAIA2 evaluation on a translated Gaia2 dataset.
#
# Two things distinguish this from the other templates:
#   - `[target].dataset_root` points at a *translated* scenario tree, produced by
#     `mt/scripts/run_translate.sh` (see gaia2-cli/mt/README.md);
#   - `[judge].prompt_version` selects the multilingual judge prompt overrides,
#     without which a correct non-English answer is routinely scored as a miss.
#
# Edit the paths, model names, base URLs, and API key env vars before running.

[target]
# The `output_dir` written by mt/scripts/run_translate.sh: one subdir per split.
# Env vars expand at load time.
dataset_root = "/path/to/omnilingual-gaia2/spa_Latn/data"
# The four capabilities Omnilingual-GAIA2 covers. Listed explicitly rather than
# with "all", which also expands to `time` — a split the translated corpus does
# not contain, so "all" fails with a missing-split-directory error here.
splits = ["execution", "search", "ambiguity", "adaptability"]

[agent]
image = "localhost/gaia2-oc:latest"
provider = "openai-compat"
model = "your-agent-model"
api_key_env = "OPENAI_COMPAT_API_KEY"
base_url = "http://localhost:8000/v1"
# Enabled, as the paper does for open-weight agents. Set "off" for models that
# are not reasoning models (e.g. Gemma).
thinking = "high"

[judge]
provider = "openai-compat"
model = "gpt-oss-120b"
api_key_env = "OPENAI_COMPAT_API_KEY"
base_url = "http://localhost:8001/v1"
# Multilingual checker prompts. Omit for the stock gaia2-core prompts.
prompt_version = "omnilingual-gaia2"
# Required for Qwen3 thinking checkpoints, which otherwise return content=null
# on every verdict. Harmless for other providers; drop it if unneeded.
# extra_body = { chat_template_kwargs = { enable_thinking = true } }

[run]
timeout = 1200
health_timeout = 180
concurrency = 4
# Long non-Latin rollouts idle between tool calls; the 300s default cuts them
# off and records them as infra errors.
idle_timeout = 600.0
# pass@3 is the headline metric; 1 would make the any-of-N aggregation a no-op.
pass_at = 3
output_dir = "/tmp/omnilingual_gaia2_spa"
log_level = "INFO"
